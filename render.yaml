services:
  - type: web
    name: carrerafut
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    # Both safe to re-run on every deploy/restart: migrate skips already-applied migrations, and
    # the seed script upserts (see prisma/seed.ts).
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm run start
    envVars:
      # Real value (a Supabase Postgres connection string) is set directly on the service in the
      # Render dashboard/API — never committed here, since this repo is public.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_COOKIE_NAME
        value: carrerafut_session
      - key: NODE_ENV
        value: production
